  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event.pull_request.draft == false

      # The toolchain container predates GLIBC 2.28, so GitHub cannot inject
      # its Node runtime into it. Run the build via docker instead: actions
      # stay on the host, only the compile happens inside the container.
      - name: Build in the toolchain container
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e HOST=x86_64-pc-linux-gnu \
            -e BASEPREFIX=/opt/blocknetdx/blocknet/depends \
            -e DEPENDS_CACHE=/proj/depends-cache \
            blocknetdx/devbuilds:gitlab-linux \
            bash -c '
              set -e
              rm -rf $BASEPREFIX
              mv $DEPENDS_CACHE $BASEPREFIX
              chmod +x ./autogen.sh; sync
              ./autogen.sh
              CONFIG_SITE="$BASEPREFIX/$HOST/share/config.site" ./configure \
                CC=gcc-8 CXX=g++-8 CFLAGS="-g3 -O0" CXXFLAGS="-g3 -O0" \
                --enable-debug --prefix=/
              make clean
              make -j $(nproc)
              mkdir -p /src/dist
              make install DESTDIR=/src/dist
            '

      - name: Make artifacts readable
        run: sudo chown -R $(id -u):$(id -g) dist

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: |
            dist/bin/blocknet-cli
            dist/bin/blocknetd
            dist/bin/blocknet-tx
            dist/bin/test_blocknet
